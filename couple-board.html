<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>Quadro do Casal 💑</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* ===== Integração visual com seu style.css =====
     - Fonte, fundo e botões já vêm do seu style.css
     - Aqui só ajustamos layout e usamos **sua** paleta:
       botão: #ffb6c1 (hover: #ffa6c9) | borda: #ffd1dc | cards: #fff
  */

  /* AppBar + Abas (colada no topo, com borda na cor do site) */
  .appbar{
    position: sticky; top:0; z-index: 30;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #ffd1dc;
  }
  .appbar-inner{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 10px 12px;
  }
  .app-title{ font-weight:900; font-size:1.05rem; display:flex; align-items:center; gap:8px; color:#7a3956; }
  .app-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:1px solid #ffd1dc; background:#fff; color:#7a3956;
    border-radius:12px; padding:10px 12px; line-height:1;
    box-shadow: 0 6px 16px rgba(0,0,0,.06);
  }

  .tabs{
    display:flex; gap:8px; overflow:auto; padding: 6px 12px 10px;
    scroll-snap-type: x mandatory;
  }
  .chip{
    flex:0 0 auto; scroll-snap-align:start;
    border:1px solid #ffd1dc; background:#fff; color:#7a3956;
    padding:8px 12px; border-radius:999px; font-weight:700;
  }
  .chip.active{ background:#ffe4e1; border-color:#ffb6c1; color:#7a3956; }

  /* Container: aproveita seu .container (box branco com sombra) */
  .wrap.container{ padding: 14px 14px 96px; }
  .progress{ background:#ffe4e1; height:12px; border-radius:999px; overflow:hidden; margin:6px 0 10px; }
  .progress i{ display:block; height:100%; width:0%; background:#ffb6c1; transition: width .25s ease; }
  .stats{ display:flex; gap:10px; align-items:center; color:#666; font-size:.95rem; justify-content:center; }

  /* Grid e cartões (cards brancos, borda rosinha) */
  .grid{
    display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px;
  }
  @media (min-width:540px){ .grid{ grid-template-columns: repeat(2,1fr); } }

  .card{
    display:flex; gap:12px; align-items:flex-start;
    background:#fff; border:1px solid #ffd1dc; border-radius:16px;
    padding:14px; box-shadow: 0 6px 16px rgba(0,0,0,.06);
  }
  .tick{
    width:40px; height:40px; border-radius:12px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-weight:900;
    border:2px solid #ffd1dc; background:#fff; color:#ffb6c1;
  }
  .tick.done{ background:#e7f9ef; border-color:#c9efdb; color:#167a3a; }
  .content{ flex:1; min-width:0; text-align:left; }
  .title{ font-weight:900; line-height:1.3; color:#7a3956; }
  .meta{ color:#666; font-size:.92rem; margin-top:2px; }
  .chips{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .k{
    font-size:.8rem; padding:4px 8px; border-radius:999px;
    background:#ffe4e1; color:#7a3956; border:1px solid #ffd1dc;
  }
  .k.ok{ background:#e7f9ef; color:#167a3a; border-color:#c9efdb; }
  .danger{ color:#b54a6f; font-weight:800; border:none; background:transparent; }

  /* FAB e barra inferior: usam sua cor de botão */
  .fab{
    position: fixed; right: 16px; bottom: 88px;
    background:#ffb6c1; color:#fff; border:none; border-radius:999px;
    padding: 14px 16px; font-weight:900; box-shadow: 0 8px 20px rgba(0,0,0,.1);
  }
  .fab:active{ transform: translateY(1px); }

  .bottombar{
    position: fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; gap:8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.85); border-top:1px solid #ffd1dc; backdrop-filter: blur(10px);
  }
  .seg{ flex:1; display:flex; background:#fff; border:1px solid #ffd1dc; border-radius:12px; overflow:hidden;}
  .seg button{
    flex:1; padding:12px; border:none; background:transparent; font-weight:800; color:#666;
  }
  .seg button.active{ background:#ffe4e1; color:#7a3956; }

  /* Bottom sheet (add/edit) com sua paleta */
  .sheet{
    position: fixed; left:0; right:0; bottom:-100%;
    background:#fff; border-top-left-radius:20px; border-top-right-radius:20px;
    box-shadow: 0 -8px 30px rgba(0,0,0,.2);
    transform: translateY(100%); transition: transform .22s ease; z-index:50;
    padding-bottom: env(safe-area-inset-bottom);
    border:1px solid #ffd1dc;
  }
  .sheet.open{ transform: translateY(0); bottom: 0; }
  .sheet-head{ padding: 12px 16px 8px; border-bottom:1px solid #ffd1dc; display:flex; align-items:center; justify-content:space-between; }
  .sheet-title{ font-weight:900; color:#7a3956; }
  .sheet-body{ padding: 12px 16px 16px; display:grid; gap:10px; }
  .field, .select{
    width:100%; padding:12px; border-radius:12px; border:1px solid #ffd1dc; background:#fff; outline:none;
  }
  .sheet-actions{ display:flex; gap:8px; }
  .btn-ghost{
    border:1px solid #ffd1dc; background:#fff; color:#7a3956; padding:12px 14px; border-radius:12px; font-weight:800;
  }
  .btn-primary{
    background:#ffb6c1; color:#fff; border:1px solid #ffb6c1; padding:12px 14px; border-radius:12px; font-weight:800;
  }
  .btn-primary:hover{ background:#ffa6c9; border-color:#ffa6c9; }

  /* Toast discreto */
  .toast{
    position: fixed; left:50%; transform: translateX(-50%) translateY(20px);
    bottom: calc(80px + env(safe-area-inset-bottom)); background:#333; color:#fff;
    padding:10px 14px; border-radius:999px; opacity:0; pointer-events:none;
    transition: opacity .18s ease, transform .18s ease; z-index:60; font-weight:700;
  }
  .toast.show{ opacity:.96; transform: translateX(-50%) translateY(0); }

  /* Estado vazio */
  .empty{ text-align:center; padding: 20px 10px; color:#666; }
</style>
</head>
<body>
  <!-- seus efeitos globais continuam funcionando -->
  <div class="hearts"></div><div class="balloons"></div><div class="confetti"></div><div class="fireworks"></div>

  <header class="appbar">
    <div class="appbar-inner">
      <div class="app-title">💑 Quadro do casal</div>
      <div class="app-actions">
        <button id="shareBtn" class="icon-btn" title="Salvar progresso em link">🔗</button>
        <button id="loadBtn" class="icon-btn" title="Carregar do link atual">⬇️</button>
        <a href="index.html" class="icon-btn" title="Voltar">←</a>
      </div>
    </div>
    <nav id="tabs" class="tabs" aria-label="Categorias"></nav>
  </header>

  <!-- Usa seu .container pra manter o “cartão branco” central -->
  <main class="wrap container">
    <div class="progress" aria-label="Progresso">
      <i id="bar"></i>
    </div>
    <div class="stats">
      <strong id="doneCount">0</strong>/<span id="totalCount">0</span> feitos
      <span>•</span>
      <span id="catInfo">Todas as categorias</span>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>
      <p>Sem itens aqui. Toque em <strong>“+”</strong> para adicionar ✨</p>
    </div>
  </main>

  <!-- FAB e barra inferior no seu padrão -->
  <button id="fab" class="fab" aria-label="Adicionar">＋</button>

  <div class="bottombar" role="toolbar" aria-label="Filtros">
    <div class="seg" role="tablist" aria-label="Status">
      <button id="segAll"  class="active" role="tab" aria-selected="true">Todos</button>
      <button id="segPend" role="tab" aria-selected="false">Pendentes</button>
      <button id="segDone" role="tab" aria-selected="false">Feitos</button>
    </div>
    <button id="todayBtn" class="icon-btn" style="flex:0 0 auto;" title="Sugestão pra hoje">💡</button>
    <button id="printBtn" class="icon-btn" style="flex:0 0 auto;" title="Imprimir">🖨️</button>
  </div>

  <!-- Bottom Sheet (Add/Edit) -->
  <aside id="sheet" class="sheet" aria-hidden="true" aria-labelledby="sheetTitle" role="dialog">
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title">Adicionar item</div>
      <button id="sheetClose" class="icon-btn">✕</button>
    </div>
    <div class="sheet-body">
      <input id="fTitle" type="text" class="field" placeholder="Ex.: Piquenique ao pôr do sol" />
      <select id="fCat" class="select">
        <option>Passeios</option><option>Viagens</option><option>Comida</option>
        <option>Filmes/Séries</option><option>Saúde/Bem-estar</option><option>EmCasa</option>
        <option>Desafios</option><option>Finanças</option><option>Presentes</option>
      </select>
      <div class="sheet-actions">
        <button id="sheetCancel" class="btn-ghost" style="flex:1">Cancelar</button>
        <button id="sheetSave" class="btn-primary" style="flex:2">Salvar</button>
      </div>
    </div>
  </aside>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">Salvo!</div>

  <script>
    /* ===== Dados (iguais à versão anterior) ===== */
    const CATS = ["Passeios","Viagens","Comida","Filmes/Séries","Saúde/Bem-estar","Em Casa","Desafios","Finanças","Presentes"];
    const PRESETS = [
      {t:"Piquenique no parque ao pôr do sol", c:"Passeios", e:"🧺"},
      {t:"Ver o nascer do sol juntos", c:"Passeios", e:"🌅"},
      {t:"Ir a uma livraria e escolher livros um pro outro", c:"Passeios", e:"📚"},
      {t:"Caminhar de mãos dadas sem destino", c:"Passeios", e:"🚶‍♀️🚶‍♂️"},
      {t:"Assistir ao pôr do sol na praia/mirante", c:"Passeios", e:"🌇"},
      {t:"Planejar mini-viagem de fim de semana", c:"Viagens", e:"🧳"},
      {t:"Conhecer uma cidade vizinha", c:"Viagens", e:"🗺️"},
      {t:"Viajar ouvindo nossa playlist", c:"Viagens", e:"🎧"},
      {t:"Ficar em um Airbnb temático", c:"Viagens", e:"🏡"},
      {t:"Noite de massas em casa", c:"Comida", e:"🍝"},
      {t:"Preparar o prato preferido um do outro", c:"Comida", e:"👩‍🍳👨‍🍳"},
      {t:"Tour de cafés", c:"Comida", e:"☕"},
      {t:"Dia do sorvete: sabores diferentões", c:"Comida", e:"🍨"},
      {t:"Cozinhar uma receita de outro país", c:"Comida", e:"🌍"},
      {t:"Trilogia + pipoca", c:"Filmes/Séries", e:"🍿"},
      {t:"Rever nosso filme favorito", c:"Filmes/Séries", e:"🎬"},
      {t:"Assistir algo fora da zona de conforto", c:"Filmes/Séries", e:"🎥"},
      {t:"Aula de alongamento/yoga juntos", c:"Saúde/Bem-estar", e:"🧘"},
      {t:"Caminhada de 5km conversando", c:"Saúde/Bem-estar", e:"🥾"},
      {t:"Skincare + massagem em casa", c:"Saúde/Bem-estar", e:"💆"},
      {t:"Quebra-cabeça com música", c:"EmCasa", e:"🧩"},
      {t:"Organizar fotos e montar um álbum", c:"EmCasa", e:"🖼️"},
      {t:"Escrever cartas um para o outro", c:"EmCasa", e:"💌"},
      {t:"Noite à luz de velas (sem telas)", c:"EmCasa", e:"🕯️"},
      {t:"24h sem redes (só nós)", c:"Desafios", e:"📵"},
      {t:"Aprender algo novo juntos", c:"Desafios", e:"🧠"},
      {t:"Completar 10 metas até a próxima data", c:"Desafios", e:"🎯"},
      {t:"Mini-planejamento de uma meta a dois", c:"Finanças", e:"📈"},
      {t:"Abrir uma caixinha de poupança do casal", c:"Finanças", e:"💰"},
      {t:"Um mês anotando gastos do casal", c:"Finanças", e:"📝"},
      {t:"Presente DIY (feito à mão)", c:"Presentes", e:"🎁"},
      {t:"Playlist surpresa um pro outro", c:"Presentes", e:"🎶"},
      {t:"Recriar uma foto antiga do casal", c:"Presentes", e:"📸"},
    ];

    const STORAGE_KEY = "couple_board_v2";
    let state = loadState();
    function loadState(){
      const base = { tasks: PRESETS.map((p,i)=>({id:"p"+i, ...p, done:false, custom:false})), custom: [] };
      try{ const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return base; const s=JSON.parse(raw); s.tasks??=base.tasks; s.custom??=[]; return s; }
      catch{ return base; }
    }
    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    const items = ()=>[...state.tasks, ...state.custom];

    /* ===== Refs ===== */
    const $tabs = document.getElementById("tabs");
    const $grid = document.getElementById("grid");
    const $empty = document.getElementById("empty");
    const $bar = document.getElementById("bar");
    const $done = document.getElementById("doneCount");
    const $tot = document.getElementById("totalCount");
    const $catInfo = document.getElementById("catInfo");
    const $toast = document.getElementById("toast");

    let filterCat = "Todos";
    let filterDone = "all";

    /* ===== Abas ===== */
    function renderTabs(){
      const cats = ["Todos", ...CATS];
      $tabs.innerHTML = "";
      cats.forEach(cat=>{
        const b = document.createElement("button");
        b.className = "chip" + (filterCat===cat ? " active" : "");
        b.textContent = cat;
        b.addEventListener("click", ()=>{ filterCat=cat; document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active")); b.classList.add("active"); render(); });
        $tabs.appendChild(b);
      });
    }

    /* ===== Render ===== */
    function render(){
      let list = items();
      if(filterCat!=="Todos") list = list.filter(x=>x.c===filterCat);
      if(filterDone==="pending") list = list.filter(x=>!x.done);
      if(filterDone==="done") list = list.filter(x=>x.done);

      const total = items().length;
      const done = items().filter(x=>x.done).length;
      $tot.textContent = total; $done.textContent = done;
      $bar.style.width = total ? (done/total*100).toFixed(1)+"%" : "0%";
      $catInfo.textContent = filterCat==="Todos" ? "Todas as categorias" : filterCat;

      $grid.innerHTML = "";
      if(!list.length){ $empty.hidden = false; return; }
      $empty.hidden = true;

      list.forEach(item=>{
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <button class="tick ${item.done? "done": ""}" aria-pressed="${item.done}" aria-label="Marcar como feito">
            ${item.done ? "✓" : "○"}
          </button>
          <div class="content">
            <div class="title">${item.e? item.e+" " : ""}${item.t}</div>
            <div class="meta">${item.c}${item.custom ? " • personalizado" : ""}</div>
            <div class="chips">
              <span class="k ${item.done? "ok": ""}">${item.done? "Feito ✅":"Em aberto"}</span>
              ${item.custom ? '<button class="danger" title="Remover">remover</button>' : ""}
              <button class="danger" data-edit="1" title="Editar" style="opacity:.8">editar</button>
            </div>
          </div>
        `;
        // toggle
        el.querySelector(".tick").addEventListener("click", ()=>{
          item.done=!item.done; saveState(); render(); toast(item.done? "Marcado como feito ✅":"Desmarcado");
          if(navigator.vibrate){ try{ navigator.vibrate(10);}catch{} }
        });
        // remover custom
        const del = el.querySelector(".danger");
        if(del && item.custom){
          del.addEventListener("click", ()=>{
            state.custom = state.custom.filter(x=>x.id!==item.id);
            saveState(); render(); toast("Item removido");
          });
        }
        // editar
        el.querySelector("[data-edit]").addEventListener("click", ()=> openSheet("edit", item));
        $grid.appendChild(el);
      });
    }

    /* ===== Filtros ===== */
    const segAll=document.getElementById("segAll");
    const segPend=document.getElementById("segPend");
    const segDone=document.getElementById("segDone");
    function setSeg(which){
      [segAll,segPend,segDone].forEach(b=>{ b.classList.remove("active"); b.setAttribute("aria-selected","false"); });
      which.classList.add("active"); which.setAttribute("aria-selected","true");
    }
    segAll.addEventListener("click", ()=>{ filterDone="all"; setSeg(segAll); render(); });
    segPend.addEventListener("click", ()=>{ filterDone="pending"; setSeg(segPend); render(); });
    segDone.addEventListener("click", ()=>{ filterDone="done"; setSeg(segDone); render(); });

    /* ===== Toast ===== */
    let toastTimer=null;
    function toast(msg){
      $toast.textContent = msg;
      $toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=> $toast.classList.remove("show"), 1500);
    }

    /* ===== Ações simples ===== */
    document.getElementById("todayBtn").addEventListener("click", ()=>{
      const pool = items().filter(x=>!x.done);
      if(!pool.length) return toast("Tudo feito! ✨");
      const pick = pool[Math.floor(Math.random()*pool.length)];
      toast(`${pick.e? pick.e+" " : ""}${pick.t}`);
    });
    document.getElementById("printBtn").addEventListener("click", ()=> window.print());

    /* ===== Compartilhar / Carregar por link ===== */
    const shareBtn = document.getElementById("shareBtn");
    const loadBtn = document.getElementById("loadBtn");
    function b64url(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
    function fromB64url(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; return decodeURIComponent(escape(atob(s))); }
    function exportLink(){
      const payload = { v:2, tasks: state.tasks.map(x=>({id:x.id, done:x.done})), custom: state.custom };
      const code = b64url(JSON.stringify(payload));
      const url = `${location.origin}${location.pathname}#b=${code}`;
      if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(url).then(()=>toast("Link copiado 🔗")); }
      else prompt("Copie o link:", url);
    }
    function importLink(){
      const h = new URLSearchParams(location.hash.slice(1)); const code = h.get("b");
      if(!code) return toast("Nenhum progresso no link.");
      try{
        const data=JSON.parse(fromB64url(code));
        if(data?.v!==2) throw new Error("versão");
        const map=new Map(data.tasks.map(x=>[x.id,!!x.done]));
        state.tasks.forEach(x=> x.done=!!map.get(x.id));
        state.custom = (data.custom||[]).map(x=>({...x, id:x.id||("c"+Math.random().toString(36).slice(2)), custom:true}));
        saveState(); render(); toast("Quadro carregado ✅");
      }catch(e){ console.error(e); toast("Não foi possível carregar."); }
    }
    shareBtn.addEventListener("click", exportLink);
    loadBtn.addEventListener("click", importLink);
    (function(){ const h=new URLSearchParams(location.hash.slice(1)); if(h.has("b")) importLink(); })();

    /* ===== Bottom Sheet Add/Edit ===== */
    const sheet = document.getElementById("sheet");
    const sheetTitle = document.getElementById("sheetTitle");
    const fTitle = document.getElementById("fTitle");
    const fCat = document.getElementById("fCat");
    const sheetClose = document.getElementById("sheetClose");
    const sheetCancel = document.getElementById("sheetCancel");
    const sheetSave = document.getElementById("sheetSave");
    let editing = null;
    function openSheet(mode="add", item=null){
      editing = (mode==="edit" ? item : null);
      sheetTitle.textContent = editing ? "Editar item" : "Adicionar item";
      fTitle.value = editing ? item.t : "";
      fCat.value = editing ? item.c : CATS[0];
      sheet.classList.add("open"); sheet.setAttribute("aria-hidden","false");
      setTimeout(()=> fTitle.focus(), 50);
    }
    function closeSheet(){ sheet.classList.remove("open"); sheet.setAttribute("aria-hidden","true"); editing = null; }
    document.getElementById("fab").addEventListener("click", ()=> openSheet("add"));
    sheetClose.addEventListener("click", closeSheet);
    sheetCancel.addEventListener("click", closeSheet);
    sheet.addEventListener("click", (e)=>{ if(e.target===sheet) closeSheet(); });
    sheetSave.addEventListener("click", ()=>{
      const t=(fTitle.value||"").trim(); const c=fCat.value;
      if(!t) return toast("Escreva um título 🙂");
      if(editing){ editing.t=t; editing.c=c; saveState(); render(); toast("Item atualizado"); }
      else{ state.custom.push({ id:"c"+Date.now(), t, c, e:"", done:false, custom:true }); saveState(); render(); toast("Item adicionado"); }
      closeSheet();
    });

    // gesto para fechar sheet (mobile)
    (function sheetDrag(){
      let startY=null;
      sheet.addEventListener("touchstart", (e)=>{ startY=e.touches[0].clientY; }, {passive:true});
      sheet.addEventListener("touchmove", (e)=>{
        if(startY==null) return;
        const dy=e.touches[0].clientY-startY;
        if(dy>0){ sheet.style.transform=`translateY(${Math.min(dy, window.innerHeight*0.9)}px)`; }
      }, {passive:true});
      sheet.addEventListener("touchend", ()=>{
        const m = sheet.style.transform.match(/translateY\((\d+(\.\d+)?)px\)/);
        const dy = m ? parseFloat(m[1]) : 0;
        sheet.style.transform = ""; // volta pro controle do CSS
        if(dy>120) closeSheet();
        startY=null;
      }, {passive:true});
    })();

    // init
    renderTabs();
    render();
  </script>
</body>
</html>
