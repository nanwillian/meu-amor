<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>365 motivos para te amar 💖</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    :root{
      --pink:#ffb6c1;
      --pink-2:#ffa6c9;
      --bg:#fffafc;
      --ink:#3a2a31;
      --ok:#2ecc71;
      --muted:#6b5b62;
      --card:#ffffff;
      --border:#ffd1dc;
      --footer-h: 68px; /* altura da navegação fixa */
    }
    html,body{ background: var(--bg); color: var(--ink); }
    /* evita “pulo” no iOS quando aparece a barra */
    body{ min-height: 100vh; min-height: -webkit-fill-available; }

    /* container principal com padding extra para não ser coberto pela bottom-nav */
    .wrap { 
      max-width: 860px; 
      margin: 0 auto; 
      padding: 12px 12px calc(var(--footer-h) + 28px + env(safe-area-inset-bottom));
    }

    .header { margin: 10px 0 2px; font-size: 1.4rem; color:#7a3956; text-align:center; }
    .sub { color:#a04c74; margin-bottom:10px; text-align:center; }

    .progressbar {
      height: 10px; background: #ffe4e1; border-radius: 999px; overflow: hidden; margin: 8px auto 10px;
      max-width: 560px;
    }
    .progressbar > i { display:block; height:100%; width:0%; background: var(--pink); transition: width .25s ease; }
    .stats { text-align:center; color:#666; margin-bottom: 10px; }

    .card {
      background: var(--card); border:1px solid var(--border);
      border-radius:16px; padding:16px; box-shadow:0 6px 16px rgba(0,0,0,.06);
    }
    .badge {
      display:inline-flex; align-items:center; gap:6px; font-size:.92rem; font-weight:700;
      background: var(--pink); color:#fff; border-radius:999px; padding:6px 12px; margin-bottom:8px;
    }
    .badge.read { background: var(--ok); }
    .motivetext { font-size:1.15rem; line-height:1.55; margin-top:6px; color:#3a2a31; }
    .read-state { display:flex; align-items:center; gap:8px; margin-top:12px; color: var(--muted); }

    /* botões principais */
    .controls { 
      position: sticky; top: 0; z-index: 5; /* dá uma grudada suave no topo ao rolar */
      display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin: 10px 0 12px; 
      padding-top: env(safe-area-inset-top);
    }
    .controls button {
      padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#fff; font-weight:800; color:#7a3956;
    }
    .controls .primary { background: var(--pink); color:#fff; border-color: var(--pink); }
    .controls .primary:active { transform: translateY(1px); }

    /* botão grande ler/lido */
    .read-btn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      width:100%; margin-top:10px; padding:14px 16px; border-radius:14px; border:none; font-weight:800;
      background: #ffe4e1; color:#a04c74;
    }
    .read-btn.active { background: #d9f7e7; color:#107a43; }
    .read-btn i { font-style:normal; font-weight:900; }

    /* grid de todos */
    .toggle-row { display:flex; justify-content:center; margin: 12px 0 8px; }
    .toggle-row button { padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:#fff; font-weight:700; color:#7a3956; }
    .grid {
      display:none; 
      grid-template-columns: repeat(auto-fill,minmax(170px,1fr));
      gap:10px; margin-top:8px;
    }
    .grid .gc {
      position: relative;
      background: #fff; border:1px solid var(--border); border-radius:12px; padding:12px; min-height:96px;
      box-shadow:0 3px 12px rgba(0,0,0,.04);
      display:flex; flex-direction:column; justify-content:space-between;
    }
    .grid .mini-badge {
      position:absolute; top:8px; right:8px; font-size:.75rem; background:#ffd1e4; color:#7a3956; padding:3px 8px; border-radius:999px;
    }
    .grid .gc.read { border-color:#bdf2d5; }
    .grid .gc.read .mini-badge { background:#bdf2d5; color:#106a3b; }
    .grid .gc .mini-toggle {
      margin-top:8px; display:inline-flex; align-items:center; gap:6px; font-size:.9rem; color:#23543f;
      background:#e8fff3; padding:6px 10px; border-radius:999px; border:1px solid #c9f6df; align-self:flex-start;
    }

    /* CTA "Quadro do casal" – fica acima da bottom-nav */
    .bonus-cta {
      position: sticky; 
      bottom: calc(var(--footer-h) + 16px + env(safe-area-inset-bottom));
      z-index: 4;
      margin-top: 14px;
    }
    .btn-large {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; max-width: 560px; margin: 0 auto; 
      padding: 14px 16px; border-radius: 14px;
      background: var(--pink); color: #fff; border: 1px solid var(--pink);
      font-weight: 800; text-decoration: none;
    }
    .btn-large:active{ transform: translateY(1px); }

    /* navegação fixa inferior */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.85); backdrop-filter: blur(10px); border-top:1px solid var(--border);
      display:flex; gap:8px; z-index: 10;
      height: var(--footer-h);
      align-items: center;
    }
    .bottom-nav button {
      flex:1; padding:14px 10px; border-radius:12px; border:1px solid var(--border); background:#fff; font-weight:800; color:#7a3956;
    }
    .bottom-nav button.primary { background: var(--pink); color:#fff; border-color: var(--pink); }
    .hint { font-size:.92rem; color:#a04c74; margin-top:10px; text-align:center; }

    /* confetti */
    .confetti-piece{ position:fixed; width:8px; height:8px; opacity:.9; transform: translateY(-20px); animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .5; } }

    @media (prefers-reduced-motion: reduce){
      .confetti-piece{ animation: none; }
      .progressbar > i { transition: none; }
    }
  </style>
</head>

    // ===== Confetti =====
    function confettiBurst(x = window.innerWidth/2, y = window.innerHeight/3) {
      const colors = ['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6'];
      const cont = document.querySelector('.confetti');
      for (let i=0;i<24;i++){
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.left = (x + (Math.random()*160 - 80)) + 'px';
        piece.style.top  = (y + (Math.random()*60  - 30)) + 'px';
        piece.style.animationDuration = (1.6 + Math.random()) + 's';
        cont.appendChild(piece);
        setTimeout(()=>piece.remove(), 2400);
      }
    }

    // ===== Datas =====
    // Use a mesma START_DATE do projeto; ajuste se necessário:
    const START_DATE = new Date(2024, 9, 22, 0, 0, 0); // 22/10/2024

    // ===== Estado =====
    let current = 0;
    const readSet = new Set(JSON.parse(localStorage.getItem("reasons_read") || "[]"));

    // ===== DOM =====
    const $badge = document.getElementById('badge');
    const $text = document.getElementById('text');
    const $btnRead = document.getElementById('btnRead');
    const $readLabel = document.getElementById('readLabel');
    const $progressText = document.getElementById('progressText');
    const $progressBar = document.getElementById('progressBar');
    const $grid = document.getElementById('grid');

    // botões topo
    document.getElementById('btnPrev').addEventListener('click', ()=> setCurrent(current-1));
    document.getElementById('btnNext').addEventListener('click', ()=> setCurrent(current+1));
    document.getElementById('btnToday').addEventListener('click', ()=> setCurrent(motiveOfTodayIndex(), true));
    // botões nav inferior (duplicam a ação, acessíveis com o polegar)
    document.getElementById('navPrev').addEventListener('click', ()=> setCurrent(current-1));
    document.getElementById('navNext').addEventListener('click', ()=> setCurrent(current+1));
    document.getElementById('navToday').addEventListener('click', ()=> setCurrent(motiveOfTodayIndex(), true));

    function fmt(i){ return `#${i+1}`; }
    function updateProgress(){
      const total = 365; // tamanho do board
      const pct = Math.min(100, (readSet.size / total) * 100);
      $progressText.textContent = `${readSet.size}/${total}`;
      $progressBar.style.width = `${pct}%`;
      localStorage.setItem("reasons_read", JSON.stringify([...readSet]));
    }
    function setReadUI(){
      const isRead = readSet.has(current);
      $btnRead.classList.toggle('active', isRead);
      $btnRead.setAttribute('aria-pressed', isRead ? 'true' : 'false');
      $btnRead.innerHTML = isRead ? '<i>✓</i> Marcado como lido' : '<i>✓</i> Marcar como lido';
      $readLabel.textContent = isRead ? 'Lido ✅' : 'Ainda não lido';
      $badge.classList.toggle('read', isRead);
    }
    function setCurrent(i, burst=false){
      if (!reasons.length) return;
      current = ((i % reasons.length) + reasons.length) % reasons.length;
      $badge.textContent = fmt(current);
      $text.textContent = reasons[current];
      setReadUI();
      if (burst) confettiBurst();
      // no iOS, rolagem suave + safe area
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function dayDiff(a,b){ return Math.floor((b-a)/(24*60*60*1000)); }
    function motiveOfTodayIndex(){
      const diff = Math.max(0, dayDiff(START_DATE, new Date()));
      return reasons.length ? diff % reasons.length : 0;
    }

    // Grid
    function renderGrid(){
      $grid.innerHTML = "";
      reasons.forEach((r,i)=>{
        const gc = document.createElement('div');
        gc.className = 'gc' + (readSet.has(i) ? ' read' : '');
        gc.innerHTML = `
          <span class="mini-badge">${fmt(i)}</span>
          <div style="font-size:.95rem; line-height:1.45; margin-top: 18px;">${r}</div>
          <div class="mini-toggle" role="button" aria-pressed="${readSet.has(i)}" title="Alternar leitura">
            ✓ ${readSet.has(i) ? 'Lido' : 'Marcar como lido'}
          </div>
        `;
        // abrir no destaque
        gc.addEventListener('click', (ev)=>{
          if (ev.target && ev.target.classList.contains('mini-toggle')) return;
          setCurrent(i);
        });
        // alternar lido
        gc.querySelector('.mini-toggle').addEventListener('click', ()=>{
          if (readSet.has(i)) readSet.delete(i); else readSet.add(i);
          gc.classList.toggle('read', readSet.has(i));
          gc.querySelector('.mini-toggle').setAttribute('aria-pressed', readSet.has(i));
          gc.querySelector('.mini-toggle').textContent = readSet.has(i) ? '✓ Lido' : '✓ Marcar como lido';
          if (i === current) setReadUI();
          updateProgress();
        });
        $grid.appendChild(gc);
      });
    }

    document.getElementById('btnToggleGrid').addEventListener('click', ()=>{
      const open = $grid.style.display === 'grid';
      $grid.style.display = open ? 'none' : 'grid';
      $grid.setAttribute('aria-hidden', open ? 'true' : 'false');
      if (!open) renderGrid();
    });

    // Botão grande de leitura (acessível)
    $btnRead.addEventListener('click', ()=>{
      if (readSet.has(current)) readSet.delete(current); else readSet.add(current);
      setReadUI();
      updateProgress();
      if (readSet.has(current)) confettiBurst();
      // haptic leve quando disponível
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch(e){} }
    });

    // Gestos (swipe) no card destaque — mobile friendly
    (function attachSwipe(){
      const el = document.getElementById('highlight');
      let x0=null, y0=null, t0=0;
      el.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); }, {passive:true});
      el.addEventListener('touchend', e=>{
        if(x0===null) return;
        const t=e.changedTouches[0];
        const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
        if (Math.abs(dx)>40 && Math.abs(dy)<50 && dt<600){
          if (dx<0) setCurrent(current+1); else setCurrent(current-1);
        }
        x0=y0=null;
      }, {passive:true});
    })();

    // Init
    setCurrent(motiveOfTodayIndex(), false);
    updateProgress();
  </script>
</body>
